<BLOCKQUOTE>
<TABLE WIDTH=600>
<TR><TD class="Review">
人気小説やアニメ等の原作はなくオリジナルのSF物で、
キャラデザやメカデザに強い売りが無く、ゲーム画面も地味とくれば売れるわけも無くワゴン常連とかしていた。
3D空間での戦闘を表現しているが、操作性が悪く空間の把握が難しいため最初のステージでクソゲー判定をされることも多い。
が、数少ない本格的な宙間戦闘物として一部では高く評価された。楽曲は渡辺俊幸。
初回版にはセーブが正常にできないバグがある模様。
</TD></TR>
</TABLE>
