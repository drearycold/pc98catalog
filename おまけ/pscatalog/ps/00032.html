メタルギアシリーズで有名な小島秀夫の作品。
オリジナルはPC9821版。その後3DO、PSに移植され、さらにSSにも移植された。
まさにこの時代を代表するAVGのひとつ。
システムはオーソドックスだが、細部まで作りこまれた高い完成度で、いまでも評価が高い。
