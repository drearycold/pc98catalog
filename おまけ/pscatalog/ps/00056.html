<TR><TD class="Review">
飛行船による空戦を題材としたアクションRPG。
RPG部分はかなりやっつけ仕事で旧世代レベルのグラフィックが泣けるが、空戦はなかなか雰囲気が出ていて評価された。
印象的なCMやテーマ曲の評判も良かったのだが、値崩れを起こしワゴンの常連として有名に。
</TD></TR>
