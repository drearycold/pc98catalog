<TR><TD class="Review">
後にアトリエシリーズで有名になるガストのPS参入作品。
アトリエを思わせる点はまったくないが、PS初期作に共通する妙な味わいが、この作品にもある。
ちなみに元ネタとした神話や歴史が共通していたのか、
小説「アルスラーン戦記」と同じ名前がザッハーク等色々と出てくる。
