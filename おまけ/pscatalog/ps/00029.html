<TR><TD class="Review">
オーソドックスな大作RPGが望まれていた中、
開発キャメロット、キャラデザ柴田亜美という名の知られたスタッフによるこの作品が発表される。
SCEは大作RPGとしてかなり強気の広告展開を行ったが、
実際には微妙な出来だったため、広告で煽られたユーザーの反発が強く、
クソゲーと呼ばれることが多い。ちなみに楽曲は桜庭統。
</TD></TR>
