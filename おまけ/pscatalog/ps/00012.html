<TABLE WIDTH=600>
<TR><TD class="Review">
PS発売前のプロモーションでも積極的に使われていたタイトル。
後にグランツーリスモを制作する山内一典の作品ということで、
カートゥーンな見た目ながらも、造りは意外と本格派。
しかし、同時期にあの「リッジ」がある以上、どうしても日陰者とならざるをえなかった。
キャラクターデザインは松下進。
