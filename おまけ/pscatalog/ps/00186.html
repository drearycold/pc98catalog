<BLOCKQUOTE>
<TABLE WIDTH=600>
<TR><TD class="Review">
PS初期の3D格闘としてスマッシュヒットとなったゼロディバイドの続編。
多少キャラのポリゴンが寂しい作りになってしまったが、前作の30フレームから60フレームとなった。
ゲーム本編の完成度も高く、トレーニングモード等もしっかりした造りだが、
発売が遅れ、前作の勢いをいかすことができず埋もれてしまった。
</TD></TR>
</TABLE>
