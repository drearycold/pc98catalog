<li>Review

<BLOCKQUOTE>
<TABLE WIDTH=600>
<TR><TD class="Review">
ゾンビ映画を意識したホラーアクションアドヴェンチャー。
大手カプコンの作品とはいえ、雑誌などでは真価が伝わらず前評判は高くなかったが、
体験版が配布され、その出来が知られることになりヒットにつながる。
旧世代機では表現しえなかった「恐怖」を見事に作り出し、その後のホラーゲームに大きな影響を与え、
PSを代表する一作と評価されている。
</TD></TR>
</TABLE>
