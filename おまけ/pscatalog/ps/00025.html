<BLOCKQUOTE>
<TABLE WIDTH=600>
<TR><TD class="Review">
トレーニングと食事のメニューを決めてボクサーを育てる育成ゲームの要素と、
直接ボクサーを操作して闘うスポーツゲームの両要素を持ったボクシングゲーム。
ボクシングゲームにはいままであまりろくなものがなかったが、
減量の苦労が身に沁みる育成部分も、全ボタンを駆使する試合部分も、いままでにない本格派で、
キングスフィールドと同様に無名のメーカーの作品ながらもPS初期のヒット作となった。
</TD></TR>
</TABLE>
