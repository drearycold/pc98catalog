<TR><TD class="Review">
トラックボールで自機であるドラゴンを操作する一風変わったアクションゲーム。
トラックボールだと、全方向へ攻撃がくるくる回りながら楽に行えるので、
攻撃にはゲージによる制限をつけてバランスがとられている。
ゲージは、自機の移動により回復する、いかにもトラックボールを生かしたアイデア。
