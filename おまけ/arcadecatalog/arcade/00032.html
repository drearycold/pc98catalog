<TABLE WIDTH=600>
<TR><TD class="Review">
傾斜のあるコース(ループ)を進みすべての旗を取ればステージクリアとなるアクションゲーム。
自機は車で、前進だけでなく後退も可能。コース上の敵車は、
スピードを殺すことで避けたりジャンプでよけたり踏んづけたりし回避。
坂はある程度勢いがなければ登れず、後退してしまう等、可愛い見た目と裏腹に中々高難度な作品。
<BR>
</TD></TR>
