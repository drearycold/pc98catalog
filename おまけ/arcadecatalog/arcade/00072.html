<TR><TD class="Review">
システムは古典的なシューティングなのだが、
新興宗教団と地蔵様の戦いという設定のためカルトゲームとして有名に。
ゲーム発売の翌年、地下鉄サリン事件が発生。
同時期だったらタイトル変更か存在自体消えていたと考えられる。
<BR>
</TD></TR>
