<TR><TD class="Review">
大ヒットしたストIIは、その後、直接の続編は出さずに改良版のリリースが続いた。
この作品は、その最初の改良版。
四天王といわれるボス的存在の４キャラが使用可能になったのと、
同キャラ対戦ができるようになったのが大きな特徴。
このバージョンのストIIを改造した海賊版があるのだが、MAMEでそれらもプレイ可能(sf2red、sf2rb等)。
