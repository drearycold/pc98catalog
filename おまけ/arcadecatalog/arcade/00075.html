お仕置きシーンが特徴の脱衣麻雀。
快楽天はコミック誌の名前で、そこから多数の作家を起用。
起用された原画家は文月晃、時坂夢戯、かるま龍狼、森永みるく
、いのうえたくや、久我山リカコ、ＯＫＡＭＡ
、道満晴明、加藤礼次朗、琴吹かづき、ＳＡＢＥ、陽気婢。
