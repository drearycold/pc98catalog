<BLOCKQUOTE>
<TABLE WIDTH=600>
<TR><TD class="Review">
ツインレバーを使用するアクションシューティング。
それぞれのレバーの方向が移動と攻撃の方向となっている。
様々な武器(床に出現するのを拾う)を駆使し、四方から押し寄せる敵と弾を避けつつ撃ちまくり。
固定画面のフロア内で一定の敵を倒しきれば、次のフロアへ進む。
いくつかのフロアを抜けるとステージのボスと戦うことになる。
SFCに移植されている。
<BR>
