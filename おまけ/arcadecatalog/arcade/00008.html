キャラクターデザインは土器手司。
多くの脱衣麻雀は、脱衣アニメにはこだわるが、対戦中の演出はどれも似たようなもの。
しかし、この作品は、対戦中の演出と脱衣演出を同じ流れの中で扱うことで
対戦中もキャラクターを生き生きと表現しているのが特徴。
