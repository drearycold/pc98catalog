<TR><TD class="Review">
落ち物パズルゲーム。ブロックに硬貨を使用。
1円なら5枚並べることで5円に変化。それが別の5円と接していれば10円に変化、つまり連鎖の発生。
身近な日本円を使ったこの秀逸なルールは、「マネーアイドルエクスチェンジャー」に丸パクリされる。
<BR>
