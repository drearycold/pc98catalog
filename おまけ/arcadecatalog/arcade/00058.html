<li>1996
<li>Review
</ul>
<BLOCKQUOTE>
<TABLE WIDTH=600>
<TR><TD class="Review">
3D女体クイックス。開発コードネームは「ニョタックス」…。
猿を操作し、女の子の衣服上のラインを敵を避け歩き囲み、服を消す。
ステージをクリアすると、カメラを操作し女の子を視姦できるショータイムが始まる。
エロゲとしかいいようのない内容で、ナムコの乱心ともいわれた。
<BR>
</TD></TR>
</TABLE>
</BLOCKQUOTE>
