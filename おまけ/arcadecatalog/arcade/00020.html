<TR><TD class="Review">
挑発、超必殺技、必殺技ゲージ、ダッシュ等、
その後につながるアイデアが盛り込まれている点で重要な作品。
数多い対戦格闘の中でも、キャラのでかさが特徴。
重い効果音やKO時のくずおれる表現が爽快で、荒削りだが、独自の魅力をもった作品。
<BR>
</TD></TR>
