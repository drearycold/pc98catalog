<H1>ホットプリントパラダイス　（ラナップ）</H1>
発売：１９９２年　メディア：ＰＣ９８　（ＦＤ２枚組）<BR>
最終更新日 2007.03.29<BR>
<HR>
<BR>
<font color="#FF8000" SIZE=+1>－概要＆感想－</FONT><BR>
　いわゆる「間違い探し」ゲーム。２枚の絵を見比べて一定時間内に１０ヶ所の間違いを探し出す。
６～９ヶ所を正解するとご褒美のＣＧが出て、１０ヶ所全部を指摘するとアニメーションする別のＣＧが表示される。７～８ヶ所を見つけるのはそれほど難しくないが、残り２ヶ所はかなり難しく難易度は高い。出題数は全部で６問で、ご褒美ＣＧのアニメーションがけっこういやらしい。<BR>
