<TD>鳩(増援・索敵アイコン)</TD>
</TR>
<TR>
<TD COLSPAN="2">
増援
<BR>マップに8部隊以内しか味方がいないとき、隣接する地域に味方部隊がいれば、
増援を呼ぶことができる。鳩一匹につき、一部隊呼ぶことができる。
<BR>索敵
<BR>待ち伏せしている敵部隊を鳩を使って索敵する。
見つけると敵部隊の待ち伏せは解除される。
