<H1>アイテム取得</H1>
<TABLE BORDER="1" WIDTH="60%">
<TR>
<TD>
<P>map上で拾えるアイテムと城の中にある宝箱の中身は、</P>
<P>一部の固定アイテム(月光石や赤い風車)以外は固定されていません。</P>
<P>そこでアイテムを取る前にセーブをして、</P>
<P>ほしいアイテムが来るまで粘り続ければ、</P>
<P>いつかはほしいものが出てきます。</P>
<P>それを使えば、</P>
<P>クラスチェンジをして強くなったユニットを使ったり、</P>
<P>能力増強アイテムを集めて最強のキャラを作ったりできます。</P>
</TD>
</TR>
</TABLE>
