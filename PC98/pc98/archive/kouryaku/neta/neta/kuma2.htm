<TABLE BORDER="1">

<TD COLSPAN="3">

<P>その部隊に呪術師やボウなどの遠距離攻撃系を1体以上入れる。</P>
<P>1ターン目で、熊の射程外になるように動く。</P>
<P>2ターン目以降ひたすら遠距離攻撃して勝つ。</P>
<P>これは熊の攻撃範囲が前方2マスという習性を利用する。</P>
